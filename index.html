<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="currencyFavicon.png" type="image/png">
    <title>Currency Converter</title>
</head>

<body>
    <div class="title">
        <h2 style="color: #301A4B;">Currency Converter</h2>
        <p style="color:#A5A2A8">Check live rates, set rate alerts, receive notifications and more.</p>
    </div>
    <div class="container">
        <form>
            <div class="exchangeArea">
                <div class="amount">
                    <p style="color: #286774;">Amount</p>
                    <div class="dropdown">
                        <div class="from">
                            <div class="select-container">
                                <img src="https://flagsapi.com/US/flat/64.png">
                                <select name="from"></select>
                                <input type="text">
                            </div>
                        </div>
                    </div>
                </div>
                <button class="icon"><i class="fa-solid fa-arrows-rotate"></i></button>
                <div class="convertedAmount">
                    <div class="amount">
                        <p style="color: #286774;">Converetd Amount</p>
                        <div class="dropdown">
                            <div class="to">
                                <div class="select-container">
                                    <img src="https://flagsapi.com/PK/flat/64.png">
                                    <select name="to"></select>
                                    <input id="input" type="text">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="message">
                <div style="color:#A5A2A8" class="firstMsg">Indicative Exchange Rate</div>
                <div style="color:black" class="secondMsg"></div>
            </div>
        </form>
    </div>
    <script src="codes.js"></script>
    <script src="script.js"></script>
</body>

</html>
